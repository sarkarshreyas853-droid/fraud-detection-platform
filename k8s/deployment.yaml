# Fraud scoring API on Kubernetes (tested target: Minikube).
# One replica on purpose: the Feast online store is a SQLite file inside the pod, so several replicas
# would each keep their own receiver history. Scaling out needs a shared online store (e.g. Redis).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
  labels: {app: fraud-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fraud-api}
  template:
    metadata:
      labels: {app: fraud-api}
    spec:
      containers:
        - name: api
          image: fraud-api:0.1
          imagePullPolicy: Never          # use the image loaded into Minikube, do not pull from a registry
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:                 # only send traffic once the model and Feast are loaded
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:                  # restart the container if it stops answering
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-api
spec:
  type: NodePort
  selector: {app: fraud-api}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
